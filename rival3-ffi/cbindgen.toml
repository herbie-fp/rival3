language = "C"
include_guard = "RIVAL3_FFI_H"
tab_width = 4
style = "both"
cpp_compat = true
include_version = true
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h", "mpfr.h"]

[export]
include = [
    "RivalDiscType",
    "RivalUnaryOp",
    "RivalUnaryParamOp",
    "RivalBinaryOp",
    "RivalTernaryOp",
    "RivalStrategy",
    "RivalOutputPolicy",
]

exclude = [
    "UnaryOpCode",
    "UnaryParamOpCode",
    "BinaryOpCode",
    "TernaryOpCode",
    "DiscTypeCode",
    "StrategyCode",
    "OutputPolicyCode",
    "mpfr_srcptr",
    "mpfr_ptr",
]

[export.rename]
"UnaryOpCode" = "RivalUnaryOp"
"UnaryParamOpCode" = "RivalUnaryParamOp"
"BinaryOpCode" = "RivalBinaryOp"
"TernaryOpCode" = "RivalTernaryOp"
"DiscTypeCode" = "RivalDiscType"
"StrategyCode" = "RivalStrategy"
"OutputPolicyCode" = "RivalOutputPolicy"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
