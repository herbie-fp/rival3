[package]
name = "rival3-ffi"
version = "0.1.0"
edition = "2024"

[lib]
name = "rival3_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
rival = { path = "..", package = "rival3", default-features = false }
gmp-mpfr-sys = "1.7"
rug = "1.30"
num_enum = { version = "0.7.6", default-features = false }

[features]
default = ["arb"]
arb = ["rival/arb"]

[build-dependencies]
cbindgen = "0.29"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
