[package]
name = "rival3-ffi"
version = "0.1.0"
edition = "2024"

[lib]
name = "rival3_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
rival = { path = "..", package = "rival3" }
gmp-mpfr-sys = "1.6"
rug = "1.28"
num_enum = { version = "0.7.6", default-features = false }

[build-dependencies]
cbindgen = "0.29"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
