[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rival3"
version = "0.1.0"
description = "Python bindings to the Rival 3 numerical evaluator"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
]

[tool.setuptools]
packages = ["rival3"]
include-package-data = true

[tool.setuptools.package-data]
rival3 = ["private/native/**/*"]
